<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin | Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="container">
      <input type="number" name="number-input" id="number-input" />
      <div class="button-container" id="button-container">
        <button class="number-btn" id="number-btn">9</button>
        <button class="number-btn" id="number-btn">8</button>
        <button class="number-btn" id="number-btn">7</button>
        <button class="number-btn" id="number-btn">6</button>
        <button class="number-btn" id="number-btn">5</button>
        <button class="number-btn" id="number-btn">4</button>
        <button class="number-btn" id="number-btn">3</button>
        <button class="number-btn" id="number-btn">2</button>
        <button class="number-btn" id="number-btn">1</button>
        <button class="number-btn" id="number-btn">0</button>
        <button class="operation-btn" id="add-btn">+</button>
        <button class="operation-btn" id="multiply-btn">*</button>
      </div>
    </div>
  </body>
</html>
